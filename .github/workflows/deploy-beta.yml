name: Beta
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enabled:
        description: Enable beta (uncheck to delete the beta site and its files)
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-beta
  cancel-in-progress: false
  # Preserve manual toggles when pushes arrive during a deployment.
  queue: max
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::066540957026:role/PolisLinktree-beta-github
          aws-region: us-east-1
          role-session-name: linktree-beta-${{ github.run_id }}
      - name: Read or update beta setting
        id: beta
        run: cargo make beta-state
        env:
          BETA_REQUEST: ${{ github.event_name == 'workflow_dispatch' && (inputs.enabled && 'enable' || 'disable') || 'status' }}
      - name: Validate enabled beta
        if: steps.beta.outputs.enabled == 'true'
        run: cargo make check
      - name: Deploy enabled beta
        if: steps.beta.outputs.enabled == 'true'
        run: cargo make deploy-beta
        env:
          BETA_BASIC_AUTH_USERNAME: ${{ secrets.BETA_BASIC_AUTH_USERNAME }}
          BETA_BASIC_AUTH_PASSWORD: ${{ secrets.BETA_BASIC_AUTH_PASSWORD }}
      - name: Remove disabled beta
        if: steps.beta.outputs.enabled == 'false'
        run: cargo make destroy-beta
